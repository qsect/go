server
{
    listen 8666;
    server_name ieslab.com;
    index index.html;

    # 指向本站点的前端编译产物目录
    root /www/wwwroot/go/frontend/dist;
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;
    access_log  /www/wwwlogs/ieslab-go.log;
    error_log   /www/wwwlogs/ieslab-go.error.log;

    # 后端 API 统一反向代理至 Go 服务 (:8080)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 上传与共享静态文件目录映射
    location ^~ /uploads/ {
        alias /www/wwwroot/go/backend/public/uploads/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    # Vue 单页应用刷新路由回退
    location / {
        try_files $uri /index.html;
    }
}
